version: 2
updates:
  # === main branch (fork template) ===
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Skip pre-release Python base-image tags (rc, alpha, beta).
      - dependency-name: "python"
        versions: ["*rc*", "*alpha*", "*beta*"]
      # Patch releases only. A new Python minor version is an upgrade to make
      # deliberately, once every compiled dependency ships wheels for it.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"

  # === unicef branch (production, auto-deploys to Fly) ===
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "unicef"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "unicef"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "unicef"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
      - "unicef"
    ignore:
      - dependency-name: "python"
        versions: ["*rc*", "*alpha*", "*beta*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "unicef"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
      - "unicef"
