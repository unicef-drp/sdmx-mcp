# fly.toml app configuration file generated for sdmx-mcp-eval on 2026-03-27T15:30:11+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sdmx-mcp-eval'
primary_region = 'fra'

[build]

[env]
  SDMX_BASE_URL = 'https://sdmx.data.unicef.org/ws/public/sdmxapi/rest'
  SDMX_THEME_PREFIX_CSV = 'theme_prefixes_domain.csv'
  SDMX_QUERY_DIMENSION_POLICY_FILE = 'query_dimension_policy.json'
  SDMX_DISCOVERY_POLICY_FILE = 'discovery_policy.json'
  SDMX_DEFAULT_LAST_N_OBSERVATIONS = 'true'
  SDMX_EXCLUDE_DRAFT = 'true'
  SDMX_AGENCY_ALLOWLIST = 'UNICEF,UNPD'
  SDMX_REF_AREA_HIERARCHY_REF = 'UNICEF/UNICEF_REPORTING_REGIONS/latest'
  # The eval measures agent behaviour inside one known flow, so pin the server
  # to GLOBAL_DATAFLOW and enforce it. Without this the agent roams: a single
  # find_indicator_candidates call returned 32 flows per candidate (~16k tokens)
  # and recommended UNICEF/CME/1.0, which does not hold the eval data, so runs
  # burned 285k tokens wandering between flows. Enforcement is server-side --
  # out-of-scope flows are rejected, not merely discouraged by the prompt.
  # Production (fly.toml) stays unscoped; real users do want cross-flow search.
  SDMX_DATAFLOW_ID_ALLOW_REGEX = '^GLOBAL_DATAFLOW$'
  SDMX_ENFORCE_SCOPE = 'true'

[deploy]
  [deploy.release_command_vm]
    memory = '2048mb'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2048mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
